<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950">
  <!-- Ember Anvil backdrop: a forge wall in scale grey with a banked glow behind the reels (original art) -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#7a3b16" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#3f2a20" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2e2a27" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bricks" width="160" height="80" patternUnits="userSpaceOnUse">
      <rect width="160" height="80" fill="#2e2a27"/>
      <path d="M0 0h160M0 40h160M80 0v40M0 40v40M160 40v40" stroke="#3a3532" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1600" height="950" fill="url(#bricks)"/>
  <rect width="1600" height="950" fill="url(#glow)"/>
  <g fill="#ffb05a" opacity=".55">
    <circle cx="240" cy="780" r="3"/><circle cx="300" cy="700" r="2"/><circle cx="1330" cy="760" r="3"/><circle cx="1400" cy="660" r="2"/>
    <circle cx="180" cy="620" r="2"/><circle cx="1460" cy="560" r="2"/><circle cx="1260" cy="840" r="2"/><circle cx="360" cy="860" r="2"/>
  </g>
  <rect y="880" width="1600" height="70" fill="#231f1d"/>
</svg>
